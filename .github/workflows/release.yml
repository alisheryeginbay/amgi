# Pushing a tag `vX.Y.Z` builds Amgi.app, signs it with the Developer ID, notarizes it
# and attaches it, as a disk image and a zip, to a draft GitHub release, with the
# appcast.xml that offers the zip to installed copies once the release is published.
# Needs these repository secrets:
#   DEVELOPER_ID_P12           the Developer ID Application certificate and key, base64
#   DEVELOPER_ID_P12_PASSWORD  the .p12's password
#   NOTARY_KEY                 an App Store Connect API key (.p8 contents)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID
#   SPARKLE_ED_PRIVATE_KEY     signs updates; its public half is SUPublicEDKey in bundle.sh
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6 # runs dmgbuild

      - name: Check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      - name: Build Amgi.app
        env:
          AMGI_SIGN_IDENTITY: Developer ID Application
        run: scripts/bundle.sh

      - name: Notarize
        env:
          AMGI_SIGN_IDENTITY: Developer ID Application
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" scripts/notarize.sh
          rm "$RUNNER_TEMP/notary.p8"

      - name: Write the update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/appcast.sh

      # A draft, so the notes can be written (and any change to card ids called out)
      # before it's published.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/bundle/Amgi-*.dmg target/bundle/Amgi-*.zip \
            target/bundle/appcast.xml \
            --draft --generate-notes --title "Amgi ${GITHUB_REF_NAME#v}"
