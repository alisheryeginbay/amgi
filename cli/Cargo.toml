[package]
name = "amgi-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "amgi"
path = "src/main.rs"

[dependencies]
amgi-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
serde = "1.0.229"
serde_json = "1.0.154"
unicode-width = "0.2.2"
